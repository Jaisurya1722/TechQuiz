<html lang="en">

<title>TechQuiz - Quiz</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#312e81);
    color:white;
    padding:20px;
}

.container{
    width:100%;
    max-width:850px;
    margin:auto;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#38bdf8;
}

.home-btn{
    padding:9px 18px;
    border:1px solid #38bdf8;
    border-radius:20px;
    background:transparent;
    color:white;
    cursor:pointer;
}

/* QUIZ BOX */

.quiz-box{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:25px;
    padding:30px;
}

/* TOP */

.quiz-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.topic{
    color:#38bdf8;
    font-weight:bold;
    font-size:18px;
}

.progress{
    color:#cbd5e1;
}

/* PROGRESS BAR */

.progress-bg{
    width:100%;
    height:8px;
    background:#334155;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:30px;
}

.progress-fill{
    height:100%;
    width:0%;
    background:#38bdf8;
    transition:0.3s;
}

/* QUESTION */

.question-number{
    color:#94a3b8;
    margin-bottom:10px;
}

.question{
    font-size:24px;
    line-height:1.5;
    margin-bottom:25px;
}

/* OPTIONS */

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.option{
    padding:18px;
    border:1px solid #475569;
    border-radius:16px;
    background:rgba(255,255,255,0.06);
    color:white;
    text-align:left;
    cursor:pointer;
    font-size:16px;
    transition:0.2s;
}

.option:hover{
    border-color:#38bdf8;
    transform:translateY(-2px);
}

.option.selected{
    border-color:#38bdf8;
    background:rgba(56,189,248,0.15);
}

/* NEXT */

.next-btn{
    width:100%;
    margin-top:25px;
    padding:14px;
    border:none;
    border-radius:25px;
    background:#38bdf8;
    color:#0f172a;
    font-weight:bold;
    font-size:17px;
    cursor:pointer;
}

.next-btn:disabled{
    opacity:0.45;
    cursor:not-allowed;
}

/* RESULT */

#resultScreen{
    display:none;
}

.result-box{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:25px;
    padding:35px;
    text-align:center;
}

.result-icon{
    font-size:65px;
}

.result-box h1{
    margin:15px 0;
}

.score{
    font-size:48px;
    color:#38bdf8;
    font-weight:bold;
    margin:15px 0;
}

.result-details{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin:25px 0;
}

.result-card{
    background:rgba(255,255,255,0.07);
    padding:18px;
    border-radius:16px;
}

.result-number{
    font-size:25px;
    font-weight:bold;
    margin-bottom:5px;
}

.result-label{
    color:#94a3b8;
    font-size:13px;
}

/* RESULT BUTTONS */

.result-buttons{
    display:flex;
    gap:15px;
    margin-top:20px;
}

.result-btn{
    flex:1;
    padding:13px;
    border:none;
    border-radius:22px;
    background:#38bdf8;
    color:#0f172a;
    font-weight:bold;
    cursor:pointer;
}

.result-btn.secondary{
    background:transparent;
    border:1px solid #38bdf8;
    color:white;
}

/* WRONG ANSWERS */

#wrongScreen{
    display:none;
    margin-top:25px;
}

.wrong-title{
    font-size:22px;
    margin-bottom:15px;
}

.wrong-card{
    background:rgba(239,68,68,0.08);
    border:1px solid rgba(239,68,68,0.4);
    border-radius:18px;
    padding:20px;
    margin-bottom:15px;
}

.wrong-question{
    font-size:18px;
    font-weight:bold;
    margin-bottom:15px;
    line-height:1.5;
}

.your-answer{
    color:#fca5a5;
    margin-bottom:8px;
}

.correct-answer{
    color:#86efac;
}

.no-wrong{
    background:rgba(34,197,94,0.1);
    border:1px solid rgba(34,197,94,0.4);
    padding:25px;
    border-radius:18px;
    text-align:center;
}

/* RESPONSIVE */

@media(max-width:600px){

    .quiz-box{
        padding:22px;
    }

    .options{
        grid-template-columns:1fr;
    }

    .question{
        font-size:20px;
    }

    .result-details{
        grid-template-columns:1fr;
    }

    .result-buttons{
        flex-direction:column;
    }

}

</style>

/* =====================================================
   SHUFFLE
====================================================== */

function shuffle(array){

    let arr =
        [...array];

    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        let j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];

    }

    return arr;

}

   PREPARE QUESTIONS
====================================================== */

    shuffle(
        availableQuestions
    );


/*
Current question bank has 10
questions per topic.

Therefore never ask for more

*/

questionCount =
    Math.min(
        questionCount,
        questions.length
    );


questions =
    questions.slice(
        0,
        questionCount
    );


/* =====================================================
   QUIZ VARIABLES
====================================================== */

let currentQuestion = 0;

let score = 0;

let userAnswers = [];

let selectedAnswer = null;


/* =====================================================
   SHOW TOPIC
====================================================== */

document.getElementById(
    "topicName"
).innerText =
    selectedTopic || "Technical Quiz";


/* =====================================================
   LOAD QUESTION
====================================================== */

function loadQuestion(){

    selectedAnswer = null;


    const question =
        questions[
            currentQuestion
        ];


    document.getElementById(
        "questionNumber"
    ).innerText =
        "Question " +
        (currentQuestion + 1);


    document.getElementById(
        "progressText"
    ).innerText =
        "Question " +
        (currentQuestion + 1) +
        " / " +
        questionCount;


    document.getElementById(
        "questionText"
    ).innerText =
        question.q;


    document.getElementById(
        "progressFill"
    ).style.width =
        (
            (
                currentQuestion + 1
            )
            /
            questionCount
            *
            100
        ) + "%";


    const container =
        document.getElementById(
            "optionsContainer"
        );


    container.innerHTML = "";


    question.o.forEach(
        function(option,index){

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "option";


            button.innerText =
                option;


            button.onclick =
                function(){

                    selectAnswer(
                        index,
                        button
                    );

                };


            container.appendChild(
                button
            );

        }
    );


    document.getElementById(
        "nextButton"
    ).disabled =
        true;


    if(
        currentQuestion ===
        questionCount - 1
    ){

        document.getElementById(
            "nextButton"
        ).innerText =
            "Finish Quiz ✓";

    }
    else{

        document.getElementById(
            "nextButton"
        ).innerText =
            "Next Question →";

    }

}


/* =====================================================
   SELECT ANSWER
====================================================== */

function selectAnswer(
    index,
    button
){

    selectedAnswer =
        index;


    /*
    IMPORTANT:
    No green/red answer feedback.
    Only selected option gets
    a small blue highlight.
    */


    const buttons =
        document.querySelectorAll(
            ".option"
        );


    buttons.forEach(
        function(btn){

            btn.classList.remove(
                "selected"
            );

        }
    );


    button.classList.add(
        "selected"
    );


    document.getElementById(
        "nextButton"
    ).disabled =
        false;

}


/* =====================================================
   NEXT QUESTION
====================================================== */

function nextQuestion(){

    if(
        selectedAnswer === null
    ){

        return;

    }


    const question =
        questions[
            currentQuestion
        ];


    userAnswers.push({

        question:
            question.q,

        selected:
            question.o[
                selectedAnswer
            ],

        correct:
            question.o[
                question.a
            ],

        isCorrect:
            selectedAnswer ===
            question.a

    });


    if(
        selectedAnswer ===
        question.a
    ){

        score++;

    }


    currentQuestion++;


    if(
        currentQuestion <
        questionCount
    ){

        loadQuestion();

    }
    else{

        showResult();

    }

}


/* =====================================================
   SHOW RESULT
====================================================== */

function showResult(){

    document.getElementById(
        "quizScreen"
    ).style.display =
        "none";


    document.getElementById(
        "resultScreen"
    ).style.display =
        "block";


    const wrong =
        questionCount - score;


    const percentage =
        Math.round(
            (
                score /
                questionCount
            ) * 100
        );


    document.getElementById(
        "resultTopic"
    ).innerText =
        selectedTopic;


    document.getElementById(
        "finalScore"
    ).innerText =
        score +
        "/" +
        questionCount;


    document.getElementById(
        "correctCount"
    ).innerText =
        score;


    document.getElementById(
        "wrongCount"
    ).innerText =
        wrong;


    document.getElementById(
        "percentage"
    ).innerText =
        percentage +
        "%";


    /*
    SAVE SCORE
    */

    saveQuizResult(
        score,
        questionCount,
        percentage
    );

}

   PREVIEW WRONG ANSWERS
====================================================== */

function showWrongAnswers(){

    const wrongAnswers =
        userAnswers.filter(
            function(item){

                return !item.isCorrect;

            }
        );


    const screen =
        document.getElementById(
            "wrongScreen"
        );


    const container =
        document.getElementById(
            "wrongContainer"
        );


    screen.style.display =
        "block";


    container.innerHTML = "";


    if(
        wrongAnswers.length === 0
    ){

        container.innerHTML = `

            <div class="no-wrong">

                <h2>
                    🎉 Perfect Score!
                </h2>

                <p style="margin-top:10px;color:#cbd5e1">

                    You didn't get any question wrong.

                </p>

            </div>

        `;

        return;

    }


    wrongAnswers.forEach(
        function(item,index){

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "wrong-card";


            card.innerHTML = `

                <div class="wrong-question">

                    ${index + 1}.
                    ${escapeHTML(
                        item.question
                    )}

                </div>

                <div class="your-answer">

                    ❌ Your Answer:
                    <strong>
                        ${escapeHTML(
                            item.selected
                        )}
                    </strong>

                </div>

                <div class="correct-answer">

                    ✅ Correct Answer:
                    <strong>
                        ${escapeHTML(
                            item.correct
                        )}
                    </strong>

                </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   SAFE TEXT
====================================================== */

function escapeHTML(text){

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   SAVE QUIZ RESULT
====================================================== */

function saveQuizResult(
    score,
    total,
    percentage
){

    const currentUser =
        JSON.parse(
            localStorage.getItem(
                "currentUser"
            )
        );


    if(!currentUser){

        return;

    }


    const username =
        currentUser.username;


    const key =
        "quizResults_" +
        username;


    let results =
        JSON.parse(
            localStorage.getItem(key)
        ) || [];


    results.push({

        topic:
            selectedTopic,

        score:
            score,

        total:
            total,

        percentage:
            percentage,

        date:
            new Date()
                .toLocaleString()

    });


    localStorage.setItem(
        key,
        JSON.stringify(results)
    );

}
